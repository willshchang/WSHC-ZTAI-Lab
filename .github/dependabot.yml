# Weekly update PRs for pinned GitHub Actions (SHA pins) and the
# agents' npm dependencies. Nothing merges without human review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /03-agents
    schedule:
      interval: weekly
    # @types/node tracks the Node major we run (22, see engines in
    # 03-agents/package.json). Majors are ignored; minor and patch still come.
    # Raise this by hand when the Node major moves.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
