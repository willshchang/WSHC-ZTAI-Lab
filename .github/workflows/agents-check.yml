# ============================================================
# AGENTS CHECK PIPELINE
# ============================================================
# Runs on every push and pull request that touches 03-agents/.
#
# What this pipeline checks:
# 1. typecheck   — the TypeScript compiles with strict settings
# 2. smoke tests — each demo scenario runs end to end in mock
#                  mode (no API key, no secrets needed)
#
# Why the smoke tests prove safety, not just "it runs":
# CI has no interactive terminal, so every external write hits
# the approval gate and is DENIED BY DEFAULT. A green run means
# the agent could not post anything without a human.
#
# Official reference:
# https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-nodejs
# ============================================================

name: Agents Check

on:
  push:
    paths:
      - '03-agents/**'
      - '.github/workflows/agents-check.yml'
  pull_request:
    paths:
      - '03-agents/**'
      - '.github/workflows/agents-check.yml'

jobs:
  check:
    name: Typecheck and smoke test agents
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-agents

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 03-agents/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test every scenario (mock mode, default deny)
        run: |
          for id in northwind-transit pixel-pine sam-side-project harbor-health quickship-labs; do
            echo "::group::$id"
            out=$(npm run -s gtm:mock -- --signup "$id" < /dev/null)
            echo "$out"
            # Must finish cleanly
            echo "$out" | grep -q "GTM Signal Router done in" || { echo "FAIL: $id did not complete"; exit 1; }
            # Must never post without a human
            echo "$out" | grep -q "Would post to #gtm-routing" && { echo "FAIL: $id posted without approval"; exit 1; }
            echo "::endgroup::"
          done

      - name: Injection scenario must be blocked by policy
        run: |
          out=$(npm run -s gtm:mock -- --signup quickship-labs < /dev/null)
          echo "$out" | grep -q 'Denied: "export_all_contacts"' || { echo "FAIL: injected tool call was not blocked"; exit 1; }
          echo "OK: injected tool call blocked by policy"

      # ----------------------------------------------------------
      # SCARLET (coordinator) scenarios
      # ----------------------------------------------------------
      - name: "Scarlet: clear request is handed to the GTM agent, which still needs a human"
        run: |
          out=$(npm run -s scarlet:mock -- "route the harbor-health signup" < /dev/null)
          echo "$out"
          echo "$out" | grep -q "Scarlet hands off to GTM Signal Router" || { echo "FAIL: no handoff"; exit 1; }
          echo "$out" | grep -q "Requested by agent-scarlet" || { echo "FAIL: child run not linked to Scarlet"; exit 1; }
          echo "$out" | grep -q "Would post to #gtm-routing" && { echo "FAIL: posted without approval"; exit 1; }
          echo "$out" | grep -q "Scarlet done in" || { echo "FAIL: Scarlet did not complete"; exit 1; }

      - name: "Scarlet: agent outside her policy is blocked"
        run: |
          out=$(npm run -s scarlet:mock -- "offboard jane from the directory" < /dev/null)
          echo "$out"
          echo "$out" | grep -q 'Denied: "agent-jml"' || { echo "FAIL: unlisted agent was not blocked"; exit 1; }
          echo "$out" | grep -q "hands off" && { echo "FAIL: a handoff happened"; exit 1; }
          echo "$out" | grep -q "report_friction" || { echo "FAIL: no friction report"; exit 1; }

      - name: "Scarlet: missing detail or unknown request is reported, never guessed"
        run: |
          for req in "route the new signup" "write me a poem about tacos"; do
            out=$(npm run -s scarlet:mock -- "$req" < /dev/null)
            echo "$out"
            echo "$out" | grep -q "hands off" && { echo "FAIL: guessed a handoff for: $req"; exit 1; }
            echo "$out" | grep -q "report_friction" || { echo "FAIL: no friction report for: $req"; exit 1; }
          done

      - name: "Every agent refuses to run without its own API key"
        run: |
          out=$(npm run -s scarlet -- "route the harbor-health signup" < /dev/null 2>&1 || true)
          echo "$out" | grep -q "Refusing to run agent-scarlet" || { echo "FAIL: Scarlet ran without her key"; exit 1; }
          out=$(npm run -s gtm -- --signup harbor-health < /dev/null 2>&1 || true)
          echo "$out" | grep -q "Refusing to run agent-gtm-signal-router" || { echo "FAIL: GTM ran without its key"; exit 1; }
          echo "OK: no agent runs on a missing or borrowed key"
