# ============================================================
# TERRAFORM VALIDATION PIPELINE
# ============================================================
# Automatically validates Terraform code for both layers on every
# push and pull request.
#
# What this pipeline checks:
# 1. terraform fmt  — enforces consistent code formatting
# 2. terraform validate — checks syntax and config validity
#
# Why this matters:
# IaC without automated validation is incomplete. This pipeline
# ensures every commit meets baseline quality standards —
# catching formatting issues and syntax errors before they
# reach the main branch.
#
# Official reference:
# https://developer.hashicorp.com/terraform/tutorials/automation/github-actions
# ============================================================

name: Terraform Validate

on:
  push:
    paths:
      - '02-network/terraform/**'
      - '01-identity/terraform/**'
      - '.github/workflows/terraform-validate.yml'
  pull_request:
    paths:
      - '02-network/terraform/**'
      - '01-identity/terraform/**'
      - '.github/workflows/terraform-validate.yml'

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

# A new push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tailscale:
    name: Validate Network Layer (Tailscale)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Format Check
        working-directory: 02-network/terraform
        run: terraform fmt -check -recursive
        # Fails if any file is not properly formatted
        # Run `terraform fmt` locally to fix formatting issues

      - name: Terraform Init
        working-directory: 02-network/terraform
        run: terraform init -backend=false
        # -backend=false skips state backend init
        # Allows validation without real credentials

      - name: Terraform Validate
        working-directory: 02-network/terraform
        run: terraform validate
        # Checks syntax and internal consistency
        # Does not connect to Tailscale API

  validate-entra:
    name: Validate Identity Layer (Entra ID)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Format Check
        working-directory: 01-identity/terraform
        run: terraform fmt -check -recursive

      # The real HR export is gitignored, so CI writes a one-row
      # synthetic file. Validate needs the file to exist, not real data.
      - name: Synthetic HR fixture (real HR data stays gitignored)
        run: |
          mkdir -p 01-identity/data
          printf 'first_name,last_name,team\nCi,Fixture,Backend\n' > 01-identity/data/employees.csv

      - name: Terraform Init
        working-directory: 01-identity/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: 01-identity/terraform
        run: terraform validate
